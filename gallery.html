<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pixelart Impression gallery. Beauty, bridal, birthday, men, maternity, lifestyle and wedding photography in Uyo.">
    <meta name="theme-color" content="#f1f1ee">
    <meta property="og:title" content="Gallery | Pixelart Impression">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Browse all photography categories: Beauty, Bridals, Weddings, and more.">
    <title>Gallery | Pixelart Impression</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="img/favicon.jpeg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,400..800;1,100..125,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="gallery.css">
    <script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('px-theme');if(t)d.dataset.theme=t}catch(e){}})()</script>
</head>
<body>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lb-backdrop"></div>
    <button class="lb-close" id="lbClose" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#i-x"/></svg></button>
    <button class="lb-prev"  id="lbPrev"  aria-label="Previous photo"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#i-caret-left"/></svg></button>
    <div class="lb-img-wrap">
        <img id="lbImg" src="" alt="Enlarged photo">
    </div>
    <button class="lb-next"  id="lbNext"  aria-label="Next photo"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#i-caret-right"/></svg></button>
    <div class="lb-counter" id="lbCounter" aria-live="polite"></div>
</div>

<!-- WHATSAPP FLOAT -->
<a href="https://wa.me/2349167486667?text=Hi!%20Daniel,%20I%20came%20from%20your%20website%20and%20I%20would%20like%20to%20book%20a%20session" class="wa-float" target="_blank" rel="noopener noreferrer" aria-label="Book via WhatsApp">
<!-- <a href="https://wa.me/message/LBJRGPDP47MJP1" class="wa-float" target="_blank" rel="noopener noreferrer" aria-label="Book via WhatsApp"> -->
    <svg class="icon" aria-hidden="true"><use href="img/icons.svg#i-whatsapp-logo"/></svg>
    <span class="wa-tip">Book via WhatsApp</span>
</a>

<!-- BACK TO TOP -->
<button id="btt" aria-label="Back to top"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#i-arrow-up"/></svg></button>

<!-- HEADER -->
<header id="site-header">
    <div class="header-inner">
        <a href="index.html" class="wordmark" aria-label="Pixelart Impression, home">
            <span class="wm" aria-hidden="true">p<span class="wm-i">ı</span>xelart</span><span class="wm-sub" aria-hidden="true">impression</span>
        </a>
        <nav class="header-nav" aria-label="Main navigation">
            <a href="index.html#about">About</a>
            <a href="index.html#portfolio">Work</a>
            <a href="gallery.html" aria-current="page">Gallery</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
            <svg class="icon i-moon" aria-hidden="true"><use href="img/icons.svg#i-moon"/></svg>
            <svg class="icon i-sun" aria-hidden="true"><use href="img/icons.svg#i-sun"/></svg>
        </button>
        <a href="booking.html" class="btn btn-primary header-cta">Book a Session</a>
        <button class="burger" id="burgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
            <span></span><span></span>
        </button>
    </div>
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#portfolio">Work</a>
        <a href="index.html#contact">Contact</a>
        <a href="booking.html" class="btn btn-primary">Book a Session</a>
    </div>
</header>

<!-- GALLERY HERO -->
<div class="gallery-hero">
    <div class="gallery-hero-inner">
        <h1 class="gallery-title display">The <em>Gallery</em></h1>
        <p class="lead">Every image tells a story. Browse by category or scroll through it all.</p>
    </div>
</div>

<!-- CATEGORY STRIP -->
<nav class="cat-strip" aria-label="Filter by category">
    <div class="cat-track">
    <button class="cat-btn active" data-target="all" aria-pressed="true">All</button>
    </div>
</nav>

<main id="galleryMain"></main>

<footer class="site-footer">
    <div class="footer-row">
        <span>&copy; <span id="year"></span> Pixelart Impression. All rights reserved.</span>
        <nav class="footer-links" aria-label="Footer">
            <a href="index.html">Home</a>
            <a href="booking.html">Book a Session</a>
            <a href="https://www.instagram.com/pixelart_shotit?igsh=NHVhY256bnkxajBo" target="_blank" rel="noopener noreferrer">Instagram</a>
        </nav>
    </div>
    <div class="footer-mark" aria-hidden="true"><span class="wm">p<span class="wm-i">ı</span>xelart</span></div>
</footer>

<script src="photos.js"></script>
<script src="shared.js"></script>
<script src="gallery.js"></script>
</body>
</html>
