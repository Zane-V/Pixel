<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book a photography session with Pixelart Impression in Uyo.">
    <meta name="theme-color" content="#f1f1ee">
    <meta property="og:title" content="Book a Session | Pixelart Impression">
    <meta property="og:type" content="website">
    <title>Book a Session | Pixelart Impression</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="img/favicon.jpeg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,400..800;1,100..125,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="booking.css">
    <script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('px-theme');if(t)d.dataset.theme=t}catch(e){}})()</script>
</head>
<body>
<div class="page-wrap">
    <div class="booking-visual" aria-hidden="true">
        <div class="bv-photos" id="bvPhotos">
            <img src="https://res.cloudinary.com/dx3j36ymx/image/upload/f_auto,q_auto,w_1400/v1773508850/b1_twqqoj.jpg" alt="" fetchpriority="high">
        </div>
        <div class="bv-content">
            <span class="wordmark"><span class="wm">p<span class="wm-i">ı</span>xelart</span></span>
            <p class="bv-tagline">Your story, <em>beautifully</em> told.</p>
            <p class="bv-cat"><span class="bv-progress"><span id="bvProgress"></span></span><span class="bv-cat-mask"><span class="bv-cat-name" id="bvCat">Bridals</span></span></p>
        </div>
    </div>

    <main class="booking-main">
        <div class="booking-top">
            <a href="index.html" class="back-link"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#i-arrow-left"/></svg> Back to Home</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
                <svg class="icon i-moon" aria-hidden="true"><use href="img/icons.svg#i-moon"/></svg>
                <svg class="icon i-sun" aria-hidden="true"><use href="img/icons.svg#i-sun"/></svg>
            </button>
        </div>

        <div class="booking-header">
            <h1 class="display">Book a <em>Session</em></h1>
            <p class="lead">Fill in your details and I'll get back to you within 24 hours.</p>
        </div>

        <form class="booking-form" id="bookingForm" novalidate>
            <div class="form-row">
                <div class="field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required>
                    <span class="field-error" aria-live="polite"></span>
                </div>
                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected hidden>Select</option>
                        <option>Female</option>
                        <option>Male</option>
                        <option>Prefer not to say</option>
                    </select>
                    <span class="field-error" aria-live="polite"></span>
                </div>
            </div>

            <div class="field">
                <label for="phone">WhatsApp number</label>
                <input type="tel" id="phone" name="phone" placeholder="+234 000 000 0000" autocomplete="tel" required>
                <span class="field-error" aria-live="polite"></span>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="occasion">Occasion type</label>
                    <input type="text" id="occasion" name="occasion" placeholder="Birthday, bridal, lifestyle…" required>
                    <span class="field-error" aria-live="polite"></span>
                </div>
                <div class="field">
                    <label for="shoot_date">Preferred date</label>
                    <input type="date" id="shoot_date" name="shoot_date" required>
                    <span class="field-error" aria-live="polite"></span>
                </div>
            </div>

            <div class="field">
                <label for="outfit">Outfit type</label>
                <input type="text" id="outfit" name="outfit" placeholder="Traditional, casual, formal…" required>
                <span class="field-error" aria-live="polite"></span>
            </div>

            <div class="field">
                <label for="inspiration">Inspiration or reference</label>
                <input type="text" id="inspiration" name="inspiration" placeholder="Paste a link or describe your vision" required>
                <span class="field-error" aria-live="polite"></span>
            </div>

            <fieldset class="field packages" id="packages">
                <legend>Package</legend>
                <div class="package-grid">
                    <label class="package">
                        <input type="radio" name="price" value="Indoor shoot, 3 edited photos, studio background (30k/outfit)" required>
                        <span class="package-name">Indoor, studio background</span>
                        <span class="package-detail">3 edited photos</span>
                        <span class="package-price">₦30k <small>per outfit</small></span>
                    </label>
                    <label class="package">
                        <input type="radio" name="price" value="Indoor shoot, 3 edited photos, aesthetic background (40k/outfit)">
                        <span class="package-name">Indoor, aesthetic background</span>
                        <span class="package-detail">3 edited photos</span>
                        <span class="package-price">₦40k <small>per outfit</small></span>
                    </label>
                    <label class="package">
                        <input type="radio" name="price" value="Outdoor shoot, 4 edited photos (50k/outfit)">
                        <span class="package-name">Outdoor</span>
                        <span class="package-detail">4 edited photos</span>
                        <span class="package-price">₦50k <small>per outfit</small></span>
                    </label>
                    <label class="package">
                        <input type="radio" name="price" value="Children indoor session, 3 edited photos (30k/outfit)">
                        <span class="package-name">Children's indoor</span>
                        <span class="package-detail">3 edited photos</span>
                        <span class="package-price">₦30k <small>per outfit</small></span>
                    </label>
                </div>
                <span class="field-error" aria-live="polite"></span>
            </fieldset>

            <p class="form-status" id="formStatus" role="alert"></p>
            <button type="submit" class="btn btn-primary submit-btn"><span class="submit-label">Submit Booking Request</span></button>
        </form>
    </main>
</div>

<script src="photos.js"></script>
<script src="shared.js"></script>
<script>
/* ── Photo panel: cycles through every kind of session ── */
(function () {
    const box = document.getElementById('bvPhotos');
    const catEl = document.getElementById('bvCat');
    const bar = document.getElementById('bvProgress');
    const INTERVAL = 6000;
    box.parentElement.style.setProperty('--bv-interval', INTERVAL + 'ms');
    const first = 'v1773508850/b1_twqqoj.jpg';

    PX.catalog().then(cats => {
        // Two photos from each category, dealt round-robin so the category changes every time
        const hands = cats.map(c => PX.shuffle(c.photos.filter(p => p !== first)).slice(0, 2).map(p => ({ p, label: c.label })));
        const pool = [{ p: first, label: 'Bridals' }];
        for (let r = 0; r < 2; r++) PX.shuffle(hands).forEach(h => { if (h[r] && h[r].label !== pool[pool.length - 1].label) pool.push(h[r]); });

        function runBar() {
            bar.classList.remove('is-running'); void bar.offsetWidth; bar.classList.add('is-running');
        }
        runBar();
        PX.rotate(box, pool.map(x => x.p), {
            interval: INTERVAL,
            transform: 'f_auto,q_auto,w_1400',
            kenBurns: true,
            onChange(i) {
                runBar();
                catEl.classList.add('is-out');
                setTimeout(() => {
                    catEl.textContent = pool[i].label;
                    catEl.classList.remove('is-out'); catEl.classList.add('is-in');
                    void catEl.offsetWidth;
                    catEl.classList.remove('is-in');
                }, 260);
            }
        });
    });
})();

const bookingForm = document.getElementById('bookingForm');
const packages = document.getElementById('packages');

/* ── Inline field validation ── */
function errorFor(input) {
    const box = input.closest('.field');
    return box && box.querySelector('.field-error');
}
function showError(input, msg) {
    const err = errorFor(input);
    if (!err) return;
    err.textContent = msg;
    if (input.type === 'radio') packages.classList.add('is-invalid');
    else input.setAttribute('aria-invalid', 'true');
}
function clearError(input) {
    const err = errorFor(input);
    if (!err) return;
    err.textContent = '';
    if (input.type === 'radio') packages.classList.remove('is-invalid');
    else input.removeAttribute('aria-invalid');
}
function isEmpty(input) {
    if (input.type === 'radio') return !bookingForm.querySelector(`input[name="${input.name}"]:checked`);
    return !input.value.trim();
}
bookingForm.querySelectorAll('input:not([type="radio"]), select').forEach(input => {
    input.addEventListener('blur', () => {
        if (input.required && isEmpty(input)) showError(input, 'This field is required.');
        else clearError(input);
    });
    input.addEventListener('input', () => clearError(input));
});
packages.addEventListener('change', e => clearError(e.target));

/* ── Date: prevent past dates ── */
const dateInput = document.getElementById('shoot_date');
if (dateInput) {
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);
}

/* ── AJAX Form Submission ── */
bookingForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    // Validate all required fields before sending
    let firstInvalid = null;
    bookingForm.querySelectorAll('[required]').forEach(input => {
        if (isEmpty(input)) {
            showError(input, input.type === 'radio' ? 'Please choose a package.' : 'This field is required.');
            firstInvalid = firstInvalid || input;
        }
    });
    if (firstInvalid) { firstInvalid.focus(); return; }

    const btn    = bookingForm.querySelector('.submit-btn');
    const label  = btn.querySelector('.submit-label');
    const status = document.getElementById('formStatus');
    const originalText = label.textContent;
    function fail(msg) {
        btn.classList.remove('is-sending');
        label.textContent = originalText;
        btn.disabled = false;
        status.textContent = msg;
    }
    status.textContent = '';
    label.textContent = 'Sending…';
    btn.classList.add('is-sending');
    btn.disabled = true;

    try {
        const res = await fetch('https://formspree.io/f/xdkqdlzk', {
            method: 'POST',
            body: new FormData(bookingForm),
            headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
            window.location.href = 'thank-you.html';
        } else {
            const data = await res.json().catch(() => ({}));
            fail(data.error || 'Something went wrong. Please try again.');
        }
    } catch (err) {
        fail('Network error. Please check your connection and try again.');
    }
});
</script>
</body>
</html>
